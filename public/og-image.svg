<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f172a"/>
      <stop offset="100%" style="stop-color:#1e1b4b"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#3b82f6"/>
      <stop offset="100%" style="stop-color:#8b5cf6"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  
  <!-- Globe circle -->
  <circle cx="600" cy="200" r="70" fill="none" stroke="url(#accent)" stroke-width="3" opacity="0.3"/>
  <circle cx="600" cy="200" r="50" fill="none" stroke="url(#accent)" stroke-width="2" opacity="0.2"/>
  
  <!-- Title -->
  <text x="600" y="330" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="90" fill="white" font-weight="bold" letter-spacing="4">GALLAX</text>
  
  <!-- Subtitle -->
  <text x="600" y="390" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="30" fill="#94a3b8">NYC Multiplayer Emoji MMO</text>
  
  <!-- Feature pills -->
  <rect x="220" y="430" width="120" height="36" rx="18" fill="rgba(59,130,246,0.2)" stroke="rgba(59,130,246,0.4)" stroke-width="1"/>
  <text x="280" y="454" text-anchor="middle" font-family="Arial" font-size="15" fill="#60a5fa">Explore</text>
  
  <rect x="360" y="430" width="100" height="36" rx="18" fill="rgba(34,197,94,0.2)" stroke="rgba(34,197,94,0.4)" stroke-width="1"/>
  <text x="410" y="454" text-anchor="middle" font-family="Arial" font-size="15" fill="#4ade80">Build</text>
  
  <rect x="480" y="430" width="100" height="36" rx="18" fill="rgba(239,68,68,0.2)" stroke="rgba(239,68,68,0.4)" stroke-width="1"/>
  <text x="530" y="454" text-anchor="middle" font-family="Arial" font-size="15" fill="#f87171">Fight</text>
  
  <rect x="600" y="430" width="100" height="36" rx="18" fill="rgba(251,191,36,0.2)" stroke="rgba(251,191,36,0.4)" stroke-width="1"/>
  <text x="650" y="454" text-anchor="middle" font-family="Arial" font-size="15" fill="#fbbf24">Draw</text>
  
  <rect x="720" y="430" width="160" height="36" rx="18" fill="rgba(168,85,247,0.2)" stroke="rgba(168,85,247,0.4)" stroke-width="1"/>
  <text x="800" y="454" text-anchor="middle" font-family="Arial" font-size="15" fill="#c084fc">Play Together</text>
  
  <!-- URL -->
  <text x="600" y="560" text-anchor="middle" font-family="Arial" font-size="20" fill="#475569">gallax.pages.dev</text>
</svg>
