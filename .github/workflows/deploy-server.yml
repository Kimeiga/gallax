name: Verify Gallax server artifact
# Client and server must be activated as one reviewed release.
# The former push job copied only server.js, omitted its contract/dependencies,
# and could publish half an incompatible client/server pair.
on:
  pull_request:
    paths: ['geckos-server/**', 'package*.json', '.github/workflows/deploy-server.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: {node-version: '22'}
      - run: npm ci --prefix geckos-server --no-audit --no-fund
      - run: npm run build --prefix geckos-server