name: Deploy Geckos Server

on:
  push:
    branches: [main]
    paths:
      - 'geckos-server/src/**'
      - 'geckos-server/package*.json'
      - 'geckos-server/tsconfig.json'

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: geckos-server/package-lock.json

      - name: Build
        working-directory: geckos-server
        run: npm ci && npm run build

      - name: Deploy to VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: root
          password: ${{ secrets.VPS_PASSWORD }}
          source: geckos-server/dist/server.js
          target: /opt/gallax-server/dist/
          strip_components: 2

      - name: Reload pm2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: root
          password: ${{ secrets.VPS_PASSWORD }}
          script: pm2 reload gallax-server
