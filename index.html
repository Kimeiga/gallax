<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#000000">
  <title>Gallax</title>
  <link href="https://api.mapbox.com/mapbox-gl-js/v3.9.4/mapbox-gl.css" rel="stylesheet">
  <link rel="stylesheet" href="/src/styles.css">
</head>
<body>
  <div id="game-container">
    <div id="map"></div>
    <canvas id="game-canvas"></canvas>
  </div>
  <div id="ui">
    <div id="coords"></div>
    <div id="zoom-level"></div>
  </div>
  <!-- Login/User UI -->
  <div id="auth-ui">
    <div id="login-container">
      <button id="google-login-btn">
        <img src="https://www.google.com/favicon.ico" alt="Google" width="18" height="18">
        <span>Login with Google</span>
      </button>
    </div>
    <div id="user-container" style="display: none;">
      <img id="user-avatar" src="" alt="Avatar">
      <span id="user-name"></span>
      <div id="coin-display">
        <span class="coin-icon">💰</span>
        <span id="coin-count">0</span>
      </div>
      <button id="logout-btn">Logout</button>
    </div>
  </div>
  <!-- Mission UI -->
  <div id="mission-ui" style="display: none;">
    <button id="mission-board-btn">🎯 View Missions</button>
  </div>
  <div id="mission-board" style="display: none;">
    <div class="mission-board-header">
      <h2 id="mission-board-title">Missions</h2>
      <button id="close-mission-board">✕</button>
    </div>
    <div class="mission-tabs">
      <button class="mission-tab active" data-tab="available">Available</button>
      <button class="mission-tab" data-tab="active">Active</button>
      <button class="mission-tab" data-tab="completed">Completed</button>
    </div>
    <div id="mission-list"></div>
  </div>
  <!-- Active Missions Tracker -->
  <div id="active-missions-tracker" style="display: none;"></div>
  <!-- Mobile UI buttons -->
  <div id="mobile-ui-buttons"></div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
