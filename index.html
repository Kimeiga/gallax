<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#000000">
  <title>Gallax</title>
  <link href="https://api.mapbox.com/mapbox-gl-js/v3.9.4/mapbox-gl.css" rel="stylesheet">
  <link rel="stylesheet" href="/src/styles.css">
</head>
<body>
  <div id="game-container">
    <div id="map"></div>
    <canvas id="game-canvas"></canvas>
  </div>
  <div id="ui">
    <div id="coords"></div>
    <div id="zoom-level"></div>
  </div>
  <!-- Player Stats Panel -->
  <div id="player-stats" style="display: none;">
    <div class="stat-row">
      <span class="stat-label">⭐ Level</span>
      <span class="stat-value" id="player-level">1</span>
    </div>
    <div class="xp-bar">
      <div class="xp-bar-fill" id="xp-bar-fill" style="width: 0%"></div>
    </div>
    <div class="stat-row">
      <span class="stat-label">XP</span>
      <span class="stat-value"><span id="player-xp">0</span> / <span id="player-xp-next">100</span></span>
    </div>
    <div class="stat-row">
      <span class="stat-label">🌳 Resources</span>
      <span class="stat-value" id="player-resources">0</span>
    </div>
    <div class="stat-row">
      <span class="stat-label">🏠 Buildings</span>
      <span class="stat-value" id="player-buildings">0</span>
    </div>
    <div class="stat-row">
      <span class="stat-label">🎯 Missions</span>
      <span class="stat-value" id="player-missions">0</span>
    </div>
  </div>
  <!-- Login/User UI -->
  <div id="auth-ui">
    <div id="login-container">
      <button id="google-login-btn">
        <img src="https://www.google.com/favicon.ico" alt="Google" width="18" height="18">
        <span>Login with Google</span>
      </button>
    </div>
    <div id="user-container" style="display: none;">
      <img id="user-avatar" src="" alt="Avatar">
      <span id="user-name"></span>
      <div id="coin-display">
        <span class="coin-icon">💰</span>
        <span id="coin-count">0</span>
      </div>
      <button id="achievements-btn" title="View Achievements">🏆</button>
      <button id="logout-btn">Logout</button>
    </div>
  </div>
  <!-- Daily Reward Modal -->
  <div id="daily-reward-modal" style="display: none;">
    <div class="modal-content">
      <h2>🎁 Daily Login Reward!</h2>
      <div id="daily-reward-content">
        <div class="streak-display">
          <span class="streak-icon">🔥</span>
          <span id="streak-count">0</span>
          <span class="streak-label">Day Streak</span>
        </div>
        <div class="reward-display">
          <div class="reward-item">
            <span class="reward-icon">💰</span>
            <span id="reward-coins">0</span>
            <span class="reward-label">Coins</span>
          </div>
          <div class="reward-item">
            <span class="reward-icon">⭐</span>
            <span id="reward-xp">0</span>
            <span class="reward-label">XP</span>
          </div>
        </div>
        <div id="reward-bonus" style="display: none;"></div>
      </div>
      <button id="claim-reward-btn" class="primary-btn">Claim Reward</button>
      <button id="close-daily-reward" class="secondary-btn">Close</button>
    </div>
  </div>
  <!-- Achievements Panel -->
  <div id="achievements-panel" style="display: none;">
    <div class="panel-header">
      <h2>🏆 Achievements</h2>
      <div class="achievement-progress">
        <span id="achievement-count">0/0</span>
        <div class="progress-bar">
          <div class="progress-fill" id="achievement-progress-fill"></div>
        </div>
      </div>
      <button id="close-achievements">✕</button>
    </div>
    <div id="achievements-list"></div>
  </div>
  <!-- Mission UI -->
  <div id="mission-ui" style="display: none;">
    <button id="mission-board-btn">🎯 View Missions</button>
  </div>
  <div id="mission-board" style="display: none;">
    <div class="mission-board-header">
      <h2 id="mission-board-title">Missions</h2>
      <button id="close-mission-board">✕</button>
    </div>
    <div class="mission-tabs">
      <button class="mission-tab active" data-tab="available">Available</button>
      <button class="mission-tab" data-tab="active">Active</button>
      <button class="mission-tab" data-tab="completed">Completed</button>
    </div>
    <div id="mission-list"></div>
  </div>
  <!-- Active Missions Tracker -->
  <div id="active-missions-tracker" style="display: none;"></div>
  <!-- Mobile UI buttons -->
  <div id="mobile-ui-buttons"></div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
